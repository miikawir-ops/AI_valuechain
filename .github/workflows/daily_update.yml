name: Daily AI Valuechain Update
 
on:
  schedule:
    - cron: '0 6 * * 1-5'
    - cron: '30 20 * * 1-5'
  workflow_dispatch:
  # A code push runs the pipeline itself (manual dispatches didn't always
  # register). The bot's commit-back uses the default GITHUB_TOKEN, which
  # never triggers workflows, and only touches data files outside these paths.
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/**'

# One run at a time; a new one waits rather than cancelling one mid-commit.
concurrency:
  group: daily-update
  cancel-in-progress: false
 
permissions:
  contents: write
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Latest main, not the pushed commit: the previous run's commit-back
          # (scores_detail.jsonl appends) must be in the tree this run appends to.
          ref: main
 
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # SEC requires a contact in the User-Agent ("Name email"); unset, EDGAR
          # is refused and revenue acceleration shows as "not measured".
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python main.py --now
 
      - name: Commit and push dashboard
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html scores_history.json || true
          # Separate: a missing pathspec makes git add stage nothing at all.
          git add growth_history.json 2>/dev/null || true
          git add scores_detail.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Daily update: $(date -u +'%Y-%m-%d %H:%M') UTC"
          # A code push may have landed during the run; data files don't conflict with it.
          git pull --rebase origin main
          git push

      # Split-repo hosting (2026-10-25): this repo becomes private (AI_valuechain-src)
      # and the public miikawir-ops/AI_valuechain holds only the published pages.
      # Only the files listed here are published, paths preserved.
      - name: Prepare curated site
        run: |
          rm -rf _site && mkdir -p _site
          cp index.html ai_chain_report.html _site/

      # Skips (exit 0) until the SITE_DEPLOY_KEY secret exists; after that a
      # failed push fails the run. Refuses code/data files; keeps CNAME/.nojekyll.
      - name: Publish to the public site repo
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: python tools/publish_site.py _site miikawir-ops/AI_valuechain